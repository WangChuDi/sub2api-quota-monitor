services:
  sub2api-quota-monitor:
    image: ghcr.io/wangchudi/sub2api-quota-monitor:latest
    container_name: sub2api-quota-monitor
    restart: unless-stopped
    ports:
      - "8320:80"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
