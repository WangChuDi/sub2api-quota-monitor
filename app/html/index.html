<style>

ine-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid var(--border);border-radius:7px;background:var(--bg)}.platform-pill strong{color:var(--text);font-weight:700}.platform-pill.delta{border-color:#d9c8fb;background:#f8f5ff;color:#6f42b5}.plot-hint{display:flex;gap:14px;margin-top:7px;color:var(--muted);font-size:12px}.plot-hint span{display:inline-flex;align-items:center;gap:5px}.plot-hint i{display:inline-block}.plot-dot{width:9px;height:9px;border-radius:50%;background:#2d9cdb}.plot-line{width:16px;height:3px;background:repeating-linear-gradient(90deg,#8b5cf6 0 6px,transparent 6px 10px)}.plot-change{width:10px;height:10px;border:2px solid #ef4444;border-radius:50%;background:#fff}.chart-scroll{position:relative;height:300px;margin:0 -4px;padding:0 4px;overflow:hidden;touch-action:none}.history-chart{display:block;width:100%;height:300px}.history-empty{display:none;color:var(--muted);text-align:center;padding:112px 0}.history-empty.show{display:block}.dual-history-card{margin-top:14px}
details{margin-top:16px;padding:13px 15px;border:1px solid var(--border);border-radius:12px;background:var(--card)}summary{cursor:pointer;color:#1578ba;font-size:13px;font-weight:600}pre{margin:12px 0 0;padding:14px;border-radius:10px;background:#111827;color:#e5e7eb;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;font-size:12px}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#1e1e1e;--card:#2a2a2a;--text:#f3f3f3;--muted:#b7b7b7;--border:#ffffff2e;--primary:#0e72bc;--primary-soft:#14364d;--success-soft:#183c2a;--warning-soft:#46351c;--danger-soft:#482326;--shadow:0 8px 24px rgba(0,0,0,.16)}.metric-pill{background:#2f2f2f;border-color:#ffffff1f}.track{background:#404040}.tag{border-color:#255a7b}.badge{background:#353535;border-color:#ffffff1f;color:#c8c8c8}pre{background:#171717}}

<div class="newapi-toolbar-space" aria-hidden="true"></div>
<div class="wrap">
  <div class="head">
    <div class="title-row"><div class="title-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/><path d="M2 21h20"/></svg></div><div><h2>额度监控</h2><div class="sub">主账号 571 · Spark 账号 576 ｜ 容器集中采集与缓存</div></div></div>
    <button id="refresh" class="refresh" type="button">强制刷新</button>
  </div>
  <div id="status" class="status">正在读取容器缓存...</div>

  <div class="section-title"><span class="dot"></span><span>有效限额窗口</span></div>
  <div id="limit-grid" class="grid"></div>

  <div class="summary-grid">

    <div class="summary-card"><div class="summary-title">上游最后成功</div><div id="upstream-time" class="summary-value">--</div></div>
    <div class="summary-card"><div class="summary-title">容器采集间隔</div><div id="interval" class="summary-value">--</div></div>

  </div>

  <div class="section-title"><span class="dot"></span><span>历史趋势</span></div>
  <div class="card history-card"><div class="chart-toolbar"><div><div class="chart-title">主额度周期</div><div class="chart-sub">检测到主账号用量骤降后开始新的额度周期</div></div><div class="metric-tabs"><button class="metric active" data-metric="quota_percent">额度 %</button><button class="metric" data-metric="amount">使用金额</button></div></div><div id="cycle-tabs" class="cycle-tabs"></div><div id="cycle-meta" class="cycle-meta"></div><div class="legend"><span><i class="legend-main"></i>主账号</span></div><div class="chart-scroll"><div id="history-chart" class="history-chart" role="img" aria-label="主账号额度周期趋势图"></div></div><div id="history-empty" class="history-empty">暂无历史数据</div></div>
  <div class="card history-card dual-history-card"><div class="chart-toolbar"><div><div class="chart-title">使用额度与已用百分比</div><div class="chart-sub">使用额度为横轴，已用百分比为纵轴，用于观察总额度变化</div></div></div><div class="axis-hint"><span>横轴：使用额度</span><span>纵轴：已用百分比</span></div><div class="plot-hint"><span><i class="plot-dot"></i>采样点</span><span><i class="plot-line"></i>回归斜率</span><span><i class="plot-change"></i>显著变点</span><span class="plot-slope"><i class="plot-line"></i>当前斜率：<strong id="usage-slope-legend">--</strong></span></div><div id="usage-cycle-label" class="usage-cycle-label"></div><div id="usage-platforms" class="usage-platforms" aria-live="polite"></div><div class="chart-scroll"><div id="usage-chart" class="history-chart" role="img" aria-label="使用额度与已用百分比趋势图"></div></div><div id="usage-empty" class="history-empty">暂无历史数据</div></div>

  <details><summary>查看缓存状态 / 错误信息</summary><pre id="raw"></pre></details>
</div>
<script src="vchart-2.1.2.min.js"></script>
<script>
(function(){
"use strict";

function selectLimitWindows(quota,usage,kind){var groups=quota&&quota.groups||[],selected=null;groups.some(function(g){var name=String(g.name||"");if(kind==="main"&&name==="主额度"||kind==="spark"&&/spark/i.test(name)){selected=g;return true}return false});if(!selected&&groups.length)selected=groups[0];var windows=selected&&selected.windows||[],usageWindows=usage&&usage.windows||[],usageWindow=usageWindows.find(function(w){return w.has_active_limit})||usageWindows.find(function(w){return w.key==="seven_day"})||usageWindows[0],stats=usageWindow&&usageWindow.stats||{};if(!windows.length)windows=usageWindows.filter(function(w){return w.has_active_limit});return windows.map(function(w){var merged={};Object.keys(w).forEach(function(k){merged[k]=w[k]});merged.stats=stats;return merged})}

function renderLimits(quota,usage,sparkQuota,sparkUsage){el("limit-grid").innerHTML=fixedLimitCard("主额度",quota,usage,"main")}
